name: CI

on:
  push:
    branches: [main]
  pull_request:

# Vérifications uniquement (GitHub = sauvegarde). Le jeu est déployé depuis Gitea :
# https://space.linkatplug.be (voir DOCKER.md, deploy/update.sh).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
