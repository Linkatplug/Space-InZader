# Space InZader — déploiement Docker depuis Gitea (voir DOCKER.md, script deploy/update.sh)
services:
  space-inzader:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Fournis par deploy/update.sh (numéro de version = nombre de commits) ; sinon « dev »
        SI_BUILD: ${SI_BUILD:-dev}
        SI_BUILD_DATE: ${SI_BUILD_DATE:-}
    image: space-inzader:latest
    # Reconstruit l'image à chaque `up` : toujours le dernier code du dépôt
    pull_policy: build
    container_name: space-inzader
    ports:
      - "${HOST_PORT:-8118}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
