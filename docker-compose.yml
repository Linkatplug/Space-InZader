# Space InZader — déploiement Docker depuis Gitea (voir DOCKER.md, script deploy/update.sh)
services:
  space-inzader:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Fournis par deploy/update.sh (numéro de version = nombre de commits) ; sinon « dev »
        SI_BUILD: ${SI_BUILD:-dev}
        SI_BUILD_DATE: ${SI_BUILD_DATE:-}
    image: space-inzader:latest
    # Reconstruit l'image à chaque `up` : toujours le dernier code du dépôt
    pull_policy: build
    container_name: space-inzader
    depends_on:
      - feedback
    ports:
      - "${HOST_PORT:-8118}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Serveur des avis (F8) : joint uniquement par nginx (/api/), jamais exposé à l'extérieur
  feedback:
    build:
      context: ./feedback
      dockerfile: Dockerfile
    image: space-inzader-feedback:latest
    pull_policy: build
    container_name: space-inzader-feedback
    labels:
      app: space-inzader
    environment:
      # Jeton de la page privée, lu dans le fichier .env du serveur (jamais commité).
      # Vide ou < 24 caractères → page privée désactivée.
      FEEDBACK_ADMIN_TOKEN: ${FEEDBACK_ADMIN_TOKEN:-}
    volumes:
      - feedback-data:/app/data
    restart: unless-stopped

volumes:
  # Avis des testeurs (avis.md + archive/) : conservés entre les mises à jour
  feedback-data:
