
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Space InZader</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;700;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #020617;
        color: #f8fafc;
        font-family: 'JetBrains Mono', monospace;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
      /* Overlay Tactique */
      .overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 100;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
        background-size: 100% 4px, 3px 100%;
      }
      .vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 101;
        background: radial-gradient(circle, transparent 60%, rgba(0,0,0,0.4) 100%);
      }
    </style>
</head>
  <body>
    <div class="overlay"></div>
    <div class="vignette"></div>
    <div id="root"></div>
    <!-- Point d'entrée pour le développement local avec Vite -->
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
