# Space InZader — configuration nginx (copiée dans /etc/nginx/conf.d/default.conf)

# Adresse du client pour la limite d'avis par heure : dernière entrée de X-Forwarded-For
# (posée par le reverse proxy devant ce conteneur, s'il y en a un), sinon l'adresse directe.
map $http_x_forwarded_for $si_client_ip {
    ""                       $remote_addr;
    "~(?<last>[^,\s]+)\s*$"  $last;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

    # Types MIME : le nginx.conf principal de l'image inclut déjà /etc/nginx/mime.types
    # (js → application/javascript, css, svg, json, mp3 → audio/mpeg). Ne pas redéfinir
    # de bloc `types` ici : il remplacerait toute la table héritée.

    # Fichiers générés par Vite, nom contenant un hash → cache long
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Musiques (noms non hashés) → cache modéré, lecture partielle (Range) gérée par nginx
    location /music/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Avis des testeurs (F8) → conteneur « feedback » (non exposé). Résolution DNS à la demande :
    # nginx démarre même si le service d'avis est arrêté (le jeu reste jouable, l'avis répond 502).
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $feedback_upstream http://feedback:3000;
        proxy_pass $feedback_upstream;
        client_max_body_size 32k;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $si_client_ip;
        proxy_set_header X-Forwarded-For "";
        proxy_read_timeout 15s;
    }

    # index.html jamais mis en cache → une mise à jour est visible tout de suite
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # Le reste : fichier s'il existe, sinon repli sur index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
